<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECHO SPHERE — Orbital reference demo</title><style>html,body{margin:0;background:#02040b;color:#bfefff;font:14px system-ui}main{display:flex;gap:18px;padding:18px;flex-wrap:wrap}section{display:grid;gap:8px}canvas{width:256px;height:256px;background:#02040b;border:1px solid #17344c}button{background:#071522;color:#bfefff;border:1px solid #24506b;padding:7px 10px}small{opacity:.7}</style></head><body><main><section><strong>ORBITAL / 256px</strong><canvas id="c" width="256" height="256"></canvas><div><button data-s="idle">IDLE</button><button data-s="attack">ATTACK</button><button data-s="disabled">DISABLED</button></div><small>Canvas 2D • no shadowBlur • Y orbit = 0.55X</small></section></main><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),TAU=Math.PI*2,imgs={};for(const k of ['shell','core','crystal','satellite']){const im=new Image();im.src='../public/art/orbital-'+k+'.svg';imgs[k]=im}let state='idle',t0=performance.now(),attackAt=0;document.querySelectorAll('button').forEach(b=>b.onclick=()=>{state=b.dataset.s;if(state==='attack')attackAt=performance.now()});function op(a,b,z){return[128+Math.cos(z)*a,128+Math.sin(z)*b]}function draw(now){const t=(now-t0)/1e3,p=.5+.5*Math.sin(t*3.2),pulse=.95+p*.1,attack=Math.max(0,1-(now-attackAt)/190);x.clearRect(0,0,256,256);const cx=128,cy=128,rx=62,ry=34.1;x.save();x.globalCompositeOperation='lighter';x.strokeStyle='#8ef0ff';x.globalAlpha=.34;x.lineWidth=1.4;x.beginPath();x.ellipse(cx,cy,rx,ry,-.04,0,TAU);x.stroke();x.restore();for(let i=0;i<3;i++){const a=t*.42+i*TAU/3+(attack>0?attack*.82:0),q=op(rx,ry,a),im=imgs.satellite;if(im.complete)x.drawImage(im,q[0]-18,q[1]-18,36,36)}if(imgs.shell.complete)x.drawImage(imgs.shell,cx-30,cy-30,60,60);if(imgs.crystal.complete){x.drawImage(imgs.crystal,cx-23,cy-63,46,46);x.save();x.translate(cx,cy+40);x.rotate(Math.PI);x.drawImage(imgs.crystal,-23,-23,46,46);x.restore()}const g=x.createRadialGradient(cx,cy,0,cx,cy,42);g.addColorStop(0,'rgba(255,255,255,.85)');g.addColorStop(.22,'rgba(99,217,255,.42)');g.addColorStop(.65,'rgba(6,59,142,.15)');g.addColorStop(1,'rgba(6,59,142,0)');x.globalCompositeOperation='lighter';x.fillStyle=g;x.beginPath();x.arc(cx,cy,42,0,TAU);x.fill();if(imgs.core.complete)x.drawImage(imgs.core,cx-27*pulse,cy-27*pulse,54*pulse,54*pulse);if(state==='disabled'){x.strokeStyle='#ff4d70';x.globalAlpha=.7;x.lineWidth=1.5;x.beginPath();x.moveTo(98,118);x.lineTo(115,126);x.lineTo(103,134);x.lineTo(151,119);x.stroke()}if(state==='attack'&&attack>0){x.globalAlpha=attack*.5;x.strokeStyle='#e9fcff';x.lineWidth=2;x.beginPath();x.ellipse(cx,cy,rx,ry,-.04,0,TAU);x.stroke()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
