name: Run level-up migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-android
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/patch-levelup.mjs
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: unify tower and ability level-up choices"
          git push origin cleanup-android
