name: Run level-up migration

on:
  push:
    branches: [cleanup-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-android
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-levelup-final.mjs
      - run: node scripts/fix-levelup-white-screen.mjs
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine.ts src/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: harden unified level-up flow"
          git push origin cleanup-android
