name: Fix tower progression syntax
on:
  push:
    branches: [cleanup-android]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[tower-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix ternaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/towerProgression.ts')
          s=p.read_text()
          s=s.replace('(l>=4?.12:0)', '(l>=4 ? .12 : 0)')
          s=s.replace('(l>=7?.18:0)', '(l>=7 ? .18 : 0)')
          s=s.replace('(l>=2?.05:0)', '(l>=2 ? .05 : 0)')
          s=s.replace('(l>=5?.06:0)', '(l>=5 ? .06 : 0)')
          s=s.replace('(l>=7?.08:0)', '(l>=7 ? .08 : 0)')
          s=s.replace('l>=4?.75:.5', 'l>=4 ? .75 : .5')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/towerProgression.ts
          git diff --cached --quiet || git commit -m "Fix tower progression ternaries [tower-fix]"
          git push
