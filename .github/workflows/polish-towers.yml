name: Tower polish patcher

on:
  push:
    branches: [cleanup-android]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply tower polish
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path

          path = Path('src/renderer.ts')
          text = path.read_text(encoding='utf-8')

          old = (
              "  const tier = sphere.visualTier;\n"
              "  ctx.fillStyle = 'rgba(58,46,31,0.15)';\n"
          )
          new = (
              "  const tier = sphere.visualTier;\n"
              "  const hasTarget = s.enemies.some((enemy) => enemy.hp > 0 && Math.hypot(enemy.pos.x - sphere.pos.x, enemy.pos.y - sphere.pos.y) < radius);\n"
              "  if (hasTarget) {\n"
              "    const pulse = 0.5 + Math.sin(t * 10) * 0.5;\n"
              "    ctx.fillStyle = `rgba(${hexToRgb(baseColor)},${0.08 + pulse * 0.09})`;\n"
              "    ctx.beginPath();\n"
              "    ctx.arc(0, 0, 21 + pulse * 4, 0, Math.PI * 2);\n"
              "    ctx.fill();\n"
              "  }\n"
              "  ctx.fillStyle = 'rgba(58,46,31,0.15)';\n"
          )
          if old not in text:
              raise SystemExit('sphere marker not found')
          text = text.replace(old, new, 1)

          old = (
              "function drawPaperDart(ctx: CanvasRenderingContext2D, x: number, y: number, vx: number, vy: number, r: number, color: string): void {\n"
              "  const angle = Math.atan2(vy, vx);\n"
              "  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);\n"
          )
          new = (
              "function drawPaperDart(ctx: CanvasRenderingContext2D, x: number, y: number, vx: number, vy: number, r: number, color: string): void {\n"
              "  const angle = Math.atan2(vy, vx);\n"
              "  const speed = Math.hypot(vx, vy) || 1;\n"
              "  const trail = Math.min(18, 7 + speed * 0.035);\n"
              "  ctx.save();\n"
              "  ctx.translate(x, y);\n"
              "  ctx.rotate(angle);\n"
              "  ctx.strokeStyle = `rgba(${hexToRgb(color)},0.28)`;\n"
              "  ctx.lineWidth = Math.max(1, r * 0.45);\n"
              "  ctx.beginPath();\n"
              "  ctx.moveTo(-trail, 0);\n"
              "  ctx.lineTo(-r * 0.7, 0);\n"
              "  ctx.stroke();\n"
          )
          if old not in text:
              raise SystemExit('dart marker not found')
          text = text.replace(old, new, 1)

          old = (
              "  if (stype.aura) {\n"
              "    ctx.strokeStyle = baseColor; ctx.lineWidth = 2;\n"
          )
          new = (
              "  if (stype.aura) {\n"
              "    const auraPulse = 1 + Math.sin(t * 4) * 0.06;\n"
              "    ctx.strokeStyle = baseColor; ctx.lineWidth = 2;\n"
          )
          if old not in text:
              raise SystemExit('aura marker not found')
          text = text.replace(old, new, 1)
          old = "ctx.beginPath(); ctx.arc(0, 0, stype.auraRadius, 0, Math.PI * 2); ctx.stroke();"
          new = "ctx.beginPath(); ctx.arc(0, 0, stype.auraRadius * auraPulse, 0, Math.PI * 2); ctx.stroke();"
          if old not in text:
              raise SystemExit('aura draw marker not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/polish-towers.yml').unlink()
          PY
          python /tmp/patch.py

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer.ts .github/workflows/polish-towers.yml
          git commit -m "Polish tower targeting and projectiles [tower-polish]"
          git push
