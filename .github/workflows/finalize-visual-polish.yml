name: Finalize enemy and tower visual polish
on:
  push:
    branches:
      - cleanup-android
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-android
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply visual and collision patch
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/polish-visuals.js /tmp/polish-visuals.cjs
          node /tmp/polish-visuals.cjs
          python3 - <<'PY'
          from pathlib import Path

          renderer = Path('src/renderer.ts')
          text = renderer.read_text()
          call = '  drawTowerPaperFrame(ctx, sphere, baseColor, t);\n'
          text = text.replace(call, '')
          start = text.find('function drawSphere(')
          if start < 0:
              raise SystemExit('drawSphere not found')
          end = text.find('\nfunction ', start + 10)
          if end < 0:
              end = len(text)
          section = text[start:end]
          anchor = '  const t = Date.now() / 1000;\n'
          if anchor not in section:
              raise SystemExit('drawSphere time anchor not found')
          section = section.replace(anchor, anchor + call, 1)
          text = text[:start] + section + text[end:]
          text = text.replace('  const points = [];\n', '  const points: Array<{ x: number; y: number }> = [];\n', 1)
          renderer.write_text(text)

          collision = Path('src/spaceCollision.ts')
          text = collision.read_text()
          marker = 'function resolveEnemyTowerCollisions(s: GameState, dt: number): void {'
          if marker not in text:
              raise SystemExit('enemy tower collision function not found')
          old = '''      const minDistance = enemy.radius + TOWER_BODY_RADIUS;\n      const currentDistance = Math.hypot(dx, dy);\n      if (currentDistance >= minDistance) continue;\n\n      const normal = normalize(dx, dy);\n      const overlap = minDistance - currentDistance;\n      enemy.pos.x += normal.x * overlap;\n      enemy.pos.y += normal.y * overlap;'''
          new = '''      const minDistance = enemy.radius + TOWER_BODY_RADIUS;\n      const currentDistance = Math.hypot(dx, dy);\n\n      // Continuous collision check: a fast enemy can cross a thin tower in\n      // one frame, so checking only its final position lets it tunnel through.\n      if (currentDistance >= minDistance) {\n        const travel = Math.min(enemy.speed * dt, 140);\n        const toPlayer = normalize(s.player.pos.x - enemy.pos.x, s.player.pos.y - enemy.pos.y);\n        const previous = {\n          x: enemy.pos.x - toPlayer.x * travel,\n          y: enemy.pos.y - toPlayer.y * travel,\n        };\n        const segmentX = enemy.pos.x - previous.x;\n        const segmentY = enemy.pos.y - previous.y;\n        const segmentLengthSq = segmentX * segmentX + segmentY * segmentY;\n        const projection = segmentLengthSq > 0\n          ? Math.max(0, Math.min(1, ((tower.pos.x - previous.x) * segmentX + (tower.pos.y - previous.y) * segmentY) / segmentLengthSq))\n          : 0;\n        const closest = {\n          x: previous.x + segmentX * projection,\n          y: previous.y + segmentY * projection,\n        };\n        const sweptDx = closest.x - tower.pos.x;\n        const sweptDy = closest.y - tower.pos.y;\n        const sweptDistance = Math.hypot(sweptDx, sweptDy);\n        if (sweptDistance >= minDistance) continue;\n\n        const normal = normalize(sweptDx, sweptDy);\n        enemy.pos.x = tower.pos.x + normal.x * minDistance;\n        enemy.pos.y = tower.pos.y + normal.y * minDistance;\n      } else {\n        const normal = normalize(dx, dy);\n        const overlap = minDistance - currentDistance;\n        enemy.pos.x += normal.x * overlap;\n        enemy.pos.y += normal.y * overlap;\n      }'''
          if old not in text:
              raise SystemExit('enemy tower collision block not found')
          collision.write_text(text.replace(old, new, 1))
          PY
          grep -q 'getEnemyFacingAngle(e)' src/renderer.ts
          grep -q 'drawTowerPaperFrame(ctx, sphere, baseColor, t);' src/renderer.ts
          grep -q 'Continuous collision check' src/spaceCollision.ts
          if grep -q 'ctx.rotate(e.rotation);' src/renderer.ts; then
            echo 'Enemy still uses simulation rotation'
            exit 1
          fi
          git diff --check
      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
      - name: Commit and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            scripts/polish-visuals.js \
            .github/workflows/finalize-visual-polish.yml \
            .github/workflows/run-visual-polish-v2.yml \
            .github/workflows/run-visual-polish-now.yml \
            .github/workflows/apply-visual-polish.yml \
            .github/workflows/polish-enemies-towers.yml \
            .github/workflows/fix-visual-patcher.yml \
            .github/workflows/fix-visual-patcher-2.yml \
            .github/workflows/fix-visual-patcher-3.yml \
            .github/workflows/fix-visual-patcher-4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer.ts src/spaceCollision.ts scripts/polish-visuals.js .github/workflows
          git commit -m 'Polish creatures towers and solid collision [enemy-tower-visuals]'
          git push origin cleanup-android