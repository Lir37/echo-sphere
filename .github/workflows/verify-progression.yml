name: Verify progression build
on:
  push:
    branches: [cleanup-android]
permissions:
  contents: read
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[progression-verify]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
