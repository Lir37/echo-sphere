name: Echo Sphere Production 3D QA

on:
  push:
    branches:
      - echo-3d-glb
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Node dependencies
        run: npm ci

      - name: Install 3D asset dependencies
        run: python -m pip install -r scripts/requirements-3d.txt

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Smoke tests
        run: npm run test:smoke

      - name: Generate production GLBs
        run: npm run assets:3d

      - name: Validate GLBs
        run: npm run validate:glb

      - name: Web build
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production web server
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/echo-sphere-vite.log 2>&1 &
          echo $! > /tmp/echo-sphere-vite.pid
          sleep 5
          curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null

      - name: Playwright 15-second runtime capture
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/render-screenshot.spec.mjs --reporter=line

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-sphere-visual-qa
          path: |
            test-results/
            /tmp/echo-sphere-vite.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload GLB validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-sphere-glb-validation
          path: glb-validation-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Web build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: echo-sphere-web-dist
          path: dist/
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: echo-sphere-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
