name: Unity Migration Contracts

on:
  push:
    branches:
      - unity-migration
    paths:
      - 'UnityProject/**'
      - 'tools/EchoSphere.CoreChecks/**'
      - 'tools/EchoSphere.VisualChecks/**'
      - 'tools/EchoSphere.NativeControlArt/**'
      - 'scripts/check-unity-project.mjs'
      - 'scripts/check-unity-visual-provenance.mjs'
      - 'scripts/export-unity-*'
      - 'scripts/source-ui-view.cjs'
      - 'scripts/source-css-browser.cjs'
      - 'tests/**'
      - 'src/**'
      - 'package-lock.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.github/workflows/unity-migration-check.yml'
      - '.github/workflows/unity-android-apk.yml'
      - 'GPT/ECHO_SPHERE_UNITY_MIGRATION_AUDIT_v1.0.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Run pure C# gameplay contract checks
        run: dotnet run --project tools/EchoSphere.CoreChecks/EchoSphere.CoreChecks.csproj --configuration Release
      - name: Compare native presentation with checked-in original TypeScript and browser references
        run: dotnet run --project tools/EchoSphere.VisualChecks/EchoSphere.VisualChecks.csproj --configuration Release
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate Unity project structure and runtime boundaries
        run: node scripts/check-unity-project.mjs
      - name: Check data transferred directly from new-desing
        run: |
          node --experimental-strip-types scripts/export-unity-source-catalog.mjs --check
          node --experimental-strip-types scripts/export-unity-sphere-modifiers.mjs --check
          node --experimental-strip-types scripts/export-unity-parity-fixtures.mjs --check
      - name: Check source visuals, styles, artwork and reference provenance
        run: |
          node scripts/export-unity-visual-code.mjs --check
          node scripts/export-unity-ui-styles.mjs --check
          node scripts/export-unity-canvas-art.cjs --check
          node scripts/export-unity-control-art.cjs --check
          node scripts/export-unity-control-cursor.cjs --check
          node scripts/export-unity-presentation-meta.mjs --check
          node scripts/check-unity-visual-provenance.mjs
      - name: Run source game regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs
