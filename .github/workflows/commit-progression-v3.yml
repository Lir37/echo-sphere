name: Commit progression implementation v3
on:
  push:
    branches: [cleanup-android]
permissions:
  contents: write
jobs:
  implement:
    if: "!contains(github.event.head_commit.message, '[progression-v3]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply implementation script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow=Path('.github/workflows/implement-progression-v2.yml').read_text()
          start=workflow.index("python3 <<'PY'\n") + len("python3 <<'PY'\n")
          end=workflow.index("\n          PY\n", start)
          script=textwrap.dedent(workflow[start:end])
          exec(compile(script, 'progression-script', 'exec'), {})
          PY
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/towerProgression.ts src/gameData.ts src/engine.ts src/App.tsx
          git diff --cached --quiet || git commit -m "Implement full tower and ability progression [progression-v3]"
          git push
