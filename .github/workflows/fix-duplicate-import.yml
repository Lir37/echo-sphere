name: Fix duplicate progression import
on:
  push:
    branches: [cleanup-android]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[import-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/engine.ts')
          s=p.read_text()
          line="import { TOWER_PROGRESSION, ABILITY_PROGRESSION, towerPriority, towerLevel, towerModifiers, TOWER_ABILITY_SYNERGIES } from './towerProgression';"
          s=s.replace(line+'\n'+line, line)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine.ts
          git diff --cached --quiet || git commit -m "Fix duplicate progression import [import-fix]"
          git push
