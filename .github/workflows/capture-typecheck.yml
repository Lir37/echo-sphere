name: Capture progression typecheck
on:
  push:
    branches: [cleanup-android]
permissions:
  contents: write
jobs:
  capture:
    if: "!contains(github.event.head_commit.message, '[typecheck-capture]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        continue-on-error: true
        run: npm run typecheck > /tmp/typecheck.log 2>&1
      - name: Save output
        run: |
          mkdir -p docs
          cp /tmp/typecheck.log docs/progression-typecheck.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/progression-typecheck.log
          git commit -m "Capture progression typecheck output [typecheck-capture]" || true
          git push
