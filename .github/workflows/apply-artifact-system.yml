          engine = engine.replace("  if (s.player.artifacts.includes('radius_shard')) r *= 1.1;", "  r *= getArtifactSphereRadiusMultiplier(s);")
          engine = engine.replace("  d *= towerModifiers(s, sphere.type).damage;\n  d *= towerModifiers(s, sphere.type).damage;", "  d *= getArtifactSphereDamageMultiplier(s);\n  d *= getSphereArtifactDamageMultiplier(s, sphere);\n  d *= towerModifiers(s, sphere.type).damage;")
          engine = engine.replace("  d /= Math.max(0.01, getCharacterAttackSpeedMultiplier(s));\n  return d;", "  d /= Math.max(0.01, getCharacterAttackSpeedMultiplier(s));\n  d *= Math.max(0.5, 1 + (1 - 1 / getArtifactCooldownMultiplier(s)));\n  return d;")
          engine = engine.replace("  if (s.player.artifacts.includes('luck_talisman')) c += 0.15;", "  c += getArtifactCritChanceBonus(s);")
          engine = engine.replace("  return (s.player.abilities.dodge || 0) * 0.1;", "  return Math.min(0.75, (s.player.abilities.dodge || 0) * 0.1 + getArtifactDodgeChanceBonus(s));")
          engine = engine.replace("  return lvl * 0.03; // 3% per level — 3% at lvl1, 15% at lvl5", "  return lvl * 0.03 + getArtifactVampireBonus(s);")
          engine = engine.replace("  m *= 1 + (s.shopUpgrades.xp || 0) * 0.05;\n  if (s.player.artifacts.includes('ring_xp')) m *= 1.2;", "  m *= 1 + (s.shopUpgrades.xp || 0) * 0.05;\n  m *= getArtifactXpMultiplier(s);")
          engine = engine.replace("  let m = 1;\n  if (s.player.artifacts.includes('mage_pendant')) m *= 0.9;\n  return m;", "  return getArtifactCooldownMultiplier(s);")
          engine = engine.replace("  // regen stone artifact\n  if (s.player.artifacts.includes('regen_stone')) {\n    s.player.hp = Math.min(s.player.maxHp, s.player.hp + dt);\n  }", "  const artifactRegen = getArtifactRegenPerSecond(s);\n  if (artifactRegen > 0) {\n    s.player.hp = Math.min(s.player.maxHp, s.player.hp + artifactRegen * dt);\n  }")
          damage_anchor = "  if (Math.random() < getDodgeChance(s)) {\n    s.particles.push({ pos: { ...s.player.pos }, vel: { x: 0, y: -60 }, life: 0.5, maxLife: 0.5, color: '#e8dcc0', size: 3 });\n    return;\n  }\n"
          damage_insert = damage_anchor + "  amount *= getArtifactDamageTakenMultiplier(s);\n  if (Math.random() < getArtifactReflectChance(s)) {\n    const nearest = s.enemies.reduce((best: EnemyEntity | null, enemy) => {\n      if (enemy.hp <= 0) return best;\n      const d = Math.hypot(enemy.pos.x - s.player.pos.x, enemy.pos.y - s.player.pos.y);\n      if (d > 180) return best;\n      if (!best) return enemy;\n      const bestD = Math.hypot(best.pos.x - s.player.pos.x, best.pos.y - s.player.pos.y);\n      return d < bestD ? enemy : best;\n    }, null);\n    if (nearest) dealDamageToEnemy(s, nearest, amount * 1.25);\n  }\n"
          if damage_anchor in engine and "getArtifactDamageTakenMultiplier(s);" not in engine:
              engine = engine.replace(damage_anchor, damage_insert)

          # Apply immediate HP bonuses when an artifact is acquired mid-run.
          old_apply = "export function applyArtifact(s: GameState, id: ArtifactId): void {\n  s.player.artifacts.push(id);\n  if (id === 'amulet_hp') { s.player.maxHp += 30; s.player.hp += 30; }\n  if (id === 'dragon_heart') { s.player.maxHp += 50; s.player.hp += 50; }\n  playSound('chest');\n}"
          new_apply = "export function applyArtifact(s: GameState, id: ArtifactId): void {\n  if (s.player.artifacts.includes(id)) return;\n  s.player.artifacts.push(id);\n  const hpBonus = getArtifactMaxHpBonus(id);\n  if (hpBonus > 0) { s.player.maxHp += hpBonus; s.player.hp += hpBonus; }\n  playSound('chest');\n}"
          if old_apply in engine:
              engine = engine.replace(old_apply, new_apply)
          else:
              raise SystemExit('Could not locate applyArtifact in engine.ts')

          old_pick = "function pickArtifacts(s: GameState): ArtifactId[] {\n  const owned = new Set(s.player.artifacts);\n  const pool = (Object.keys(ARTIFACT_MAP) as ArtifactId[]).filter(a => !owned.has(a));\n  const choices: ArtifactId[] = [];\n  while (choices.length < 3 && pool.length > 0) {\n    const idx = Math.floor(Math.random() * pool.length);\n    choices.push(pool.splice(idx, 1)[0]);\n  }\n  return choices;\n}"
          new_pick = "function pickArtifacts(s: GameState): ArtifactId[] {\n  return pickArtifactChoices(s, 3);\n}"
          if old_pick in engine:
              engine = engine.replace(old_pick, new_pick)
          else:
              raise SystemExit('Could not locate pickArtifacts in engine.ts')

          engine_path.write_text(engine, encoding='utf-8')

          # Integrate the new artifact modifiers with per-tower progression.
          tower_path = ROOT / 'src/towerProgression.ts'
          tower = tower_path.read_text(encoding='utf-8')
          if "from './artifactSystem'" not in tower:
              tower = tower.replace("import type { CharacterId } from './characters';\n", "import type { CharacterId } from './characters';\nimport { getTowerArtifactModifiers } from './artifactSystem';\n")
          old_tower_fn = "export function towerModifiers(s:any,type:SphereType){const l=towerLevel(s,type);return {damage:1+l*.08+(l>=4?.12:0)+(l>=7?.18:0),radius:1+(l>=2?.05:0)+(l>=5?.06:0)+(l>=7?.08:0),delay:Math.max(.58,1-l*.045),pierce:l>=2?1:0,multishot:type==='shotgun'&&l>=1?1:0,chainTargets:type==='chain'?Math.max(1,l+1):0,auraRadius:l>=2?1.08:1,auraPulse:l>=4?.75:.5};}"
          new_tower_fn = "export function towerModifiers(s:any,type:SphereType){const l=towerLevel(s,type);const artifact=getTowerArtifactModifiers(s,type);return {damage:(1+l*.08+(l>=4?.12:0)+(l>=7?.18:0))*artifact.damage,radius:(1+(l>=2?.05:0)+(l>=5?.06:0)+(l>=7?.08:0))*artifact.radius,delay:Math.max(.48,1-l*.045)*artifact.delay,pierce:l>=2?1:0,multishot:type==='shotgun'&&l>=1?1:0,chainTargets:type==='chain'?Math.max(1,l+1):0,auraRadius:l>=2?1.08:1,auraPulse:l>=4?.75:.5};}"
          if old_tower_fn not in tower:
              raise SystemExit('Could not locate towerModifiers in towerProgression.ts')
          tower = tower.replace(old_tower_fn, new_tower_fn)
          tower_path.write_text(tower, encoding='utf-8')

          # Remove the stale component reference that caused the latest APK typecheck failure.
          app_path = ROOT / 'src/App.tsx'
          app = app_path.read_text(encoding='utf-8')
          stale_line = "          {st.pendingTowerUpgrade && <TowerUpgradeModal lang={lang} t={t} choices={st.pendingTowerUpgrade} onPick={(c) => { applyTowerUpgrade(st, c); }} />}\n"
          if stale_line in app:
              app = app.replace(stale_line, '')
          else:
              # Treat an already-clean file as success, but fail if the old symbols still exist.
              if 'TowerUpgradeModal' in app or 'applyTowerUpgrade' in app:
                  raise SystemExit('Stale TowerUpgradeModal symbols remain in App.tsx')
          app_path.write_text(app, encoding='utf-8')

          # Idempotency marker for future checks.
          marker = ROOT / 'src/artifactSystem.ts'
          if not marker.exists():
              raise SystemExit('artifactSystem.ts was not created')
          print('Artifact system patch applied.')
          PY

      - name: Typecheck
        run: npm ci && npm run typecheck

      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gameData.ts src/engine.ts src/towerProgression.ts src/App.tsx src/artifactSystem.ts
          git rm .github/workflows/apply-artifact-system.yml
          git commit -m "feat: implement artifact system [artifact-system-applied]"
          git push origin cleanup-android
