name: Apply artifact system patch

on:
  push:
    branches: [cleanup-android]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[artifact-system-applied]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cleanup-android
          fetch-depth: 1

      - name: Apply artifact architecture
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          artifact_system = r'''import type { ArtifactId } from './gameData';

export type ArtifactRarity = 'common' | 'rare' | 'epic' | 'special' | 'legendary';

export interface ArtifactEffects {
  moveSpeed?: number;
  maxHp?: number;
  xpGain?: number;
  regen?: number;
  sphereRadius?: number;
  sphereDamage?: number;
  cooldown?: number;
  damageTakenReduction?: number;
  critChance?: number;
  dodgeChance?: number;
  vampire?: number;
  towerDamage?: number;
  towerDelay?: number;
  towerRadius?: number;
  standardDamage?: number;
  sniperDamage?: number;
  shotgunDamage?: number;
  chainDamage?: number;
  auraDamage?: number;
  standardRadius?: number;
  sniperRadius?: number;
  shotgunRadius?: number;
  chainRadius?: number;
  auraRadius?: number;
}

export interface ArtifactMeta {
  id: ArtifactId;
  rarity: ArtifactRarity;
  effects: ArtifactEffects;
  mechanic?:
    | 'swift'
    | 'mirror'
    | 'resonance'
    | 'lone'
    | 'fivefold'
    | 'relay'
    | 'triangle'
    | 'overclock'
    | 'network'
    | 'singularity'
    | 'zero'
    | 'unified';
}

const meta = (id: ArtifactId, rarity: ArtifactRarity, effects: ArtifactEffects = {}, mechanic?: ArtifactMeta['mechanic']): ArtifactMeta => ({ id, rarity, effects, mechanic });

