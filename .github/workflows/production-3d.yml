name: Echo Sphere Production 3D QA

on:
  push:
    branches: [echo-3d-glb]
  pull_request:
    branches: [echo-3d-glb]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        # package-lock is updated by the same npm resolver used for this branch;
        # npm install keeps CI usable while dependency additions are being landed.
        run: npm install --no-audit --no-fund

      - name: Install 3D asset dependencies
        run: python -m pip install -r scripts/requirements-3d.txt

      - name: Typecheck
        run: npm run typecheck

      - name: Lint production 3D renderer
        run: npx eslint src/visual3d.ts --max-warnings=0

      - name: Smoke tests
        run: npm run test:smoke

      - name: Generate GLB assets
        run: npm run assets:3d

      - name: Validate GLB assets
        run: npm run validate:glb

      - name: Build Web
        run: npx vite build

      - name: Verify Web build contains 3D assets
        run: |
          test -f dist/index.html
          test -f dist/art3d/player_spherist.glb
          test -f dist/art3d/sphere_standard_t1.glb

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create/sync Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual QA twice
        run: npm run test:e2e -- --repeat-each=2

      - name: Assert visual QA artifacts
        run: |
          test -s test-results
          test -s glb-validation-report.json
          find test-results -name 'echo-sphere-render.png' -type f -size +0c | grep -q .
          find test-results -name 'render-metrics.json' -type f -size +0c | grep -q .

      - name: Upload Web build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-sphere-web-build
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-sphere-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload visual QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-sphere-visual-qa
          path: |
            test-results/
            glb-validation-report.json
            public/art3d/*.glb
          if-no-files-found: warn
          retention-days: 14
