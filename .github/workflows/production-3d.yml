name: Echo Sphere Production 3D QA

on:
  push:
    branches: [echo-3d-glb]
  pull_request:
    branches: [echo-3d-glb]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Install 3D asset dependencies
        run: python -m pip install -r scripts/requirements-3d.txt

      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund @playwright/test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Smoke tests
        run: npm run test:smoke

      - name: Generate GLB assets
        run: npm run assets:3d

      - name: Validate GLB assets
        run: npm run validate:glb

      - name: Build Web
        run: npm run build

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create/sync Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual QA
        run: npm run test:e2e

      - name: Upload Web build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-sphere-web-build
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-sphere-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload visual QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-sphere-visual-qa
          path: |
            test-results/
            glb-validation-report.json
            public/art3d/*.glb
          if-no-files-found: warn
          retention-days: 14
