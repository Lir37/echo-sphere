name: One-time combat polish

on:
  push:
    branches: [cleanup-android]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[combat-polish]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply combat polish
        shell: python
        run: |
          from pathlib import Path

          engine_path = Path('src/engine.ts')
          engine = engine_path.read_text(encoding='utf-8')

          old_damage = """  enemy.hp -= actual;\n  enemy.hitFlash = 0.15;\n  // damage number\n"""
          new_damage = """  enemy.hp -= actual;\n  enemy.hitFlash = 0.15;\n\n  // Juicier impact: a short, directional burst makes every tower hit readable.\n  const impactCount = enemy.isBoss ? 10 : isCrit ? 9 : enemy.isElite ? 7 : 4;\n  for (let i = 0; i < impactCount; i++) {\n    const angle = Math.random() * Math.PI * 2;\n    const speed = rand(isCrit ? 120 : 80, isCrit ? 260 : 180);\n    s.particles.push({\n      pos: { x: enemy.pos.x, y: enemy.pos.y },\n      vel: { x: Math.cos(angle) * speed, y: Math.sin(angle) * speed },\n      life: rand(0.16, isCrit ? 0.42 : 0.3),\n      maxLife: 0.42,\n      color: isCrit ? '#c4453d' : enemy.color,\n      size: rand(isCrit ? 2.5 : 1.5, isCrit ? 4.5 : 3.2),\n    });\n  }\n  if (isCrit) {\n    s.screenShake = Math.min(0.24, s.screenShake + 0.06);\n  }\n\n  // damage number\n"""
          if old_damage not in engine:
              raise SystemExit('engine.ts damage block not found')
          engine = engine.replace(old_damage, new_damage, 1)

          old_death = """  // particles\n  for (let i = 0; i < (enemy.isBoss ? 40 : 8); i++) {\n"""
          new_death = """  // Stronger death burst, scaled by enemy importance.\n  const deathParticles = enemy.isBoss ? 56 : enemy.isElite ? 18 : 10;\n  for (let i = 0; i < deathParticles; i++) {\n"""
          if old_death not in engine:
              raise SystemExit('engine.ts death particle block not found')
          engine = engine.replace(old_death, new_death, 1)
          engine_path.write_text(engine, encoding='utf-8')

          renderer_path = Path('src/renderer.ts')
          renderer = renderer_path.read_text(encoding='utf-8')
          old_enemy = """function drawEnemy(ctx: CanvasRenderingContext2D, e: EnemyEntity): void {\n  ctx.save();\n  ctx.translate(e.pos.x, e.pos.y);\n  ctx.rotate(e.rotation);\n  const color = e.hitFlash > 0 ? '#f4ecd8' : e.color;\n  const highlight = e.hitFlash > 0 ? '#ffffff' : shade(e.color, 35);\n"""
          new_enemy = """function drawEnemy(ctx: CanvasRenderingContext2D, e: EnemyEntity): void {\n  ctx.save();\n  const hitStrength = Math.max(0, Math.min(1, e.hitFlash / 0.15));\n  ctx.translate(e.pos.x, e.pos.y);\n  ctx.rotate(e.rotation);\n  if (hitStrength > 0) ctx.scale(1 + hitStrength * 0.1, 1 + hitStrength * 0.1);\n\n  // Paper-crumple shock ring on impact. It fades with the existing hitFlash timer.\n  if (hitStrength > 0) {\n    ctx.save();\n    ctx.strokeStyle = `rgba(196,69,61,${hitStrength * 0.45})`;\n    ctx.lineWidth = 2;\n    ctx.beginPath();\n    ctx.arc(0, 0, e.radius + 7 + (1 - hitStrength) * 8, 0, Math.PI * 2);\n    ctx.stroke();\n    ctx.restore();\n  }\n\n  const color = hitStrength > 0 ? '#f4ecd8' : e.color;\n  const highlight = hitStrength > 0 ? '#ffffff' : shade(e.color, 35);\n"""
          if old_enemy not in renderer:
              raise SystemExit('renderer.ts drawEnemy block not found')
          renderer = renderer.replace(old_enemy, new_enemy, 1)
          renderer_path.write_text(renderer, encoding='utf-8')

          Path('.github/workflows/polish-combat.yml').unlink()

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine.ts src/renderer.ts .github/workflows/polish-combat.yml
          git commit -m "Polish combat impacts [combat-polish]"
          git push
