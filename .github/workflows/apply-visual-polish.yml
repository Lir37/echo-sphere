name: Apply visual polish
on:
  push:
    branches:
      - cleanup-android
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-android
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate and patch renderer
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/polish-visuals.js
          node scripts/polish-visuals.js
          git diff --check
      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            scripts/polish-visuals.js \
            .github/workflows/apply-visual-polish.yml \
            .github/workflows/polish-enemies-towers.yml \
            .github/workflows/fix-visual-patcher-2.yml \
            .github/workflows/fix-visual-patcher-3.yml \
            .github/workflows/fix-visual-patcher-4.yml \
            .github/workflows/fix-visual-patcher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer.ts scripts/polish-visuals.js .github/workflows
          git commit -m 'Polish enemies and towers [enemy-tower-visuals]'
          git push origin cleanup-android
