name: Fix progression workflow
on:
  push:
    branches: [cleanup-android]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[progression-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix generated script syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/implement-progression.yml')
          s=p.read_text()
          s=s.replace("return i<0?.25:1-i*.18;", "return i<0 ? .25 : 1-i*.18;")
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/implement-progression.yml
          git diff --cached --quiet || git commit -m "Fix progression workflow syntax [progression-fix]"
          git push
