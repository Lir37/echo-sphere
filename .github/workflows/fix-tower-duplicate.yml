name: Fix tower duplicate
on:
  push:
    branches: [cleanup-android]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove duplicate tower frame draw
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/renderer.ts')
          s = p.read_text()
          old = "  drawTowerPaperFrame(ctx, sphere, baseColor, t);\n  drawTowerPaperFrame(ctx, sphere, stype.color, t);"
          if old not in s:
              raise SystemExit('duplicate tower frame call not found')
          s = s.replace(old, "  drawTowerPaperFrame(ctx, sphere, baseColor, t);", 1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          npm ci --ignore-scripts
          npm run typecheck
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer.ts
          git rm .github/workflows/fix-tower-duplicate.yml
          git commit -m "Clean up tower renderer duplicate [tower-shapes]"
          git push
