name: Repair visual patcher
on:
  push:
    branches:
      - cleanup-android
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-android
          fetch-depth: 0
      - name: Repair embedded source strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('.github/workflows/polish-enemies-towers.yml')
          text = path.read_text()
          names = ['sphere', 'mouse', 'fish', 'frog', 'airplane', 'butterfly', 'enemy', 'facingHelper']

          for name in names:
              pattern = re.compile(rf"const {name} = String\.raw`([\\s\\S]*?)`;", re.M)
              match = pattern.search(text)
              if not match:
                  continue
              body = match.group(1)
              body = body.replace(r'\${', '${').replace(r'\`', '`')
              body = body.replace('  const legBeat = Math.sin(t * 11);\n', '')
              replacement = f"const {name} = {json.dumps(body)};"
              text = text[:match.start()] + replacement + text[match.end():]

          path.write_text(text)
          PY
          git diff --check
      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-visual-patcher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/polish-enemies-towers.yml .github/workflows/fix-visual-patcher.yml
          git commit -m 'Repair enemy and tower visual patcher'
          git push origin cleanup-android
