name: Repair visual patcher blocks
on:
  push:
    branches:
      - cleanup-android
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-android
          fetch-depth: 0
      - name: Encode source blocks safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('.github/workflows/polish-enemies-towers.yml')
          text = path.read_text()
          names = ['sphere', 'mouse', 'fish', 'frog', 'airplane', 'butterfly', 'enemy', 'facingHelper']
          converted = 0

          for name in names:
              pattern = re.compile(rf"const {name} = String\.raw`((?:\\.|[^`])*)`;", re.S)
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f'Missing source block: {name}')
              body = match.group(1)
              body = body.replace(r'\${', '${').replace(r'\`', '`')
              body = body.replace('  const legBeat = Math.sin(t * 11);\n', '')
              replacement = f"const {name} = {json.dumps(body)};"
              text = text[:match.start()] + replacement + text[match.end():]
              converted += 1

          path.write_text(text)
          print(f'Converted {converted} blocks')
          PY
          git diff --check
          grep -q 'const mouse = "' .github/workflows/polish-enemies-towers.yml
          grep -q 'const enemy = "' .github/workflows/polish-enemies-towers.yml
      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-visual-patcher-3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/polish-enemies-towers.yml .github/workflows/fix-visual-patcher-3.yml
          git commit -m 'Encode visual patcher source blocks'
          git push origin cleanup-android
